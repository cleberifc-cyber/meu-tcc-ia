name: Compilar TCC em PDF

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/compile-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    if: ${{ hashFiles('src/tcc.md') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pandoc e XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-portuguese
      - name: Gerar PDF
        run: pandoc src/tcc.md --from markdown --pdf-engine=xelatex --resource-path=.:src -o tcc.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-pdf
          path: tcc.pdf
          if-no-files-found: error
