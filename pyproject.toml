[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-kit"
version = "0.1.0a1"
description = "Ferramentas abertas para planejar, referenciar e formatar TCCs com transparência."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2"]
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
tcc-kit = "tcc_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcc_kit = ["assets/**/*.md", "assets/**/*.txt", "assets/**/*.json", "assets/**/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
